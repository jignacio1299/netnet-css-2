<!DOCTYPE html>
<html lang="en-US">
  <head>
    <style>
      <link rel="stylesheet" href="mystyle.css">
      @keyframes color-zoom {
        0% {
          color: black;
          transform: scale(1);
        }
        50% {
          color: white;
          transform: scale(0.9);
        }
        100% {
          color: black;
          transform: scale(1);
        }
      }

      /* Source: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/rotate */
      

      h1 {
        text-align: center;
        padding: 20px;

        animation-name: colorZoom;
        animation-duration: 4s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

  0% {

}
